name: no-run

on:
  workflow_dispatch:

jobs:
  CD:
    env:
      TF_VAR_vm_ip: "${{ secrets.VM_IP }}"
      TF_VAR_vm_host: "${{ secrets.VM_HOST }}"
      TF_VAR_url_image_docker_hub: "${{ vars.URL_IMAGE_PINGOU }}"
      TF_VAR_token_bot_pingou: "${{ secrets.TOKEN_PINGOU }}"
      TF_VAR_public_bot: "${{ vars.PUBLIC_ID_PINGOU }}"
      TF_VAR_psql_user: "${{ secrets.PSQL_USER }}"
      TF_VAR_psql_pass: "${{ secrets.PSQL_PASS }}"
      TF_VAR_name_db: "${{ secrets.NAME_DB }}"
      TF_VAR_version_psql:  "16-alpine"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      
      - name: Terraform setup
        uses: hashicorp/setup-terraform@v4

      - name: Generate backend.hcl
        run: |
          cat <<EOF > backend.hcl
          access_key = "${{ secrets.R2_ACCESS_KEY_ID }}"
          secret_key = "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF
      - name: Generate ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Terraform init
        working-directory: ./infra
        run: terraform init

      - name: Terraform validate
        working-directory: ./infra
        run: terraform validate

      - name: Terraform plan
        working-directory: ./infra
        run: terraform plan -out plan.out

      - name: Terraform apply
        working-directory: ./infra
        run: terraform apply -auto-approve "plan.out"

      - run: echo "Sucess Deploy"
        


